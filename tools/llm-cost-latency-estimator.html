<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Cost & Latency Estimator</title>
    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #182232;
            --border-color: #334155; --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --accent-color: #38bdf8; --code-bg: #090d16;
        }
        @media (prefers-color-scheme: light) {
            :root { --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-card: #f1f5f9; --border-color: #e2e8f0; --text-primary: #0f172a; --text-secondary: #475569; --accent-color: #0284c7; --code-bg: #1e293b; }
        }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; padding: 2rem; max-width: 900px; margin: 0 auto; }
        .card { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border-color); text-align: left; }
        pre { background: var(--code-bg); padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; color: #cbd5e1; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        button { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; }
        button.active { background: var(--accent-color); color: white; }
    </style>
</head>
<body>
    <h1>LLM Cost & Latency Estimator</h1>
    
    <div class="card">
        <label>Input Tokens per Request: <strong id="tokenVal">1000</strong></label>
        <input type="range" id="tokenSlider" min="100" max="100000" step="100" value="1000" style="width:100%; accent-color: var(--accent-color);">
    </div>

    <div class="card">
        <table>
            <thead><tr><th>Model</th><th>Input/1M</th><th>Output/1M</th><th>Total Est.</th></tr></thead>
            <tbody id="results"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Prompt Pack</h3>
        <div class="tabs">
            <button class="active" onclick="showTab('openai')">OpenAI</button>
            <button onclick="showTab('anthropic')">Anthropic</button>
        </div>
        <pre id="codeBlock"></pre>
    </div>

    <script>
        const models = [
            { name: "GPT-4o", in: 2.50, out: 10.00 },
            { name: "Claude 3.5 Sonnet", in: 3.00, out: 15.00 },
            { name: "Gemini 1.5 Pro", in: 1.25, out: 5.00 }
        ];

        function update() {
            const tokens = document.getElementById('tokenSlider').value;
            document.getElementById('tokenVal').innerText = tokens;
            const tbody = document.getElementById('results');
            tbody.innerHTML = models.map(m => `
                <tr>
                    <td>${m.name}</td>
                    <td>$${m.in}</td>
                    <td>$${m.out}</td>
                    <td>$${((m.in + (m.out * 1.5)) * (tokens / 1000000)).toFixed(6)}</td>
                </tr>
            `).join('');
        }

        document.getElementById('tokenSlider').addEventListener('input', update);
        update();

        function showTab(type) {
            const code = type === 'openai' ? '{"model": "gpt-4o", "messages": [...]}' : '{"model": "claude-3-5-sonnet-20240620", "messages": [...] }';
            document.getElementById('codeBlock').innerText = code;
        }
    </script>
</body>
</html>
