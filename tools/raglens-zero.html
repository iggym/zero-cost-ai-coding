# Stripe PaymentIntents API

The PaymentIntent object tracks the lifecycle of a customer checkout. Use confirm to finalize.

POST /v1/payment_intents
- amount: integer (cents)
- currency: usd, eur
- payment_method: pm_123
- confirmation_method: automatic

Errors:
- card_declined: The card was declined by issuer.
- expired_card: Card expiry in past.
- incorrect_cvc: Security code mismatch.

Idempotency-Key header ensures safe retries. Use expand[]=charges to retrieve nested charge.

Webhooks:
payment_intent.succeeded, payment_intent.payment_failed, charge.refunded.

Pagination uses starting_after and ending_before cursors. Limit max 100.

Authentication via Bearer sk_test_... Keep secret keys server-side.

Rate limits: 100 read/s, 25 write/s per account.

Testing: Use 4242 4242 4242 4242 for success, 4000 0000 0000 0002 for decline.

Title: Retrieval-Augmented Generation Drift in Long-Context Codebases

Abstract: RAG pipelines often fail silently when RecursiveCharacterTextSplitter severs semantic units. Overlap heuristics of 10-20% are guessed, and embedding cosine drift between adjacent chunks is invisible without visualization. We study 847 GitHub issues mentioning semantic chunking.

1. Introduction
RAG depends on chunk boundaries preserving discourse coherence. Mid-sentence cuts introduce false negatives in dense retrieval.

2. Related Work
LangChain's splitter uses separators ["\\n\\n","\\n",". "," ",""]. While fast, it lacks semantic awareness. Semantic chunkers cluster sentences via embeddings.

3. Method
We evaluate three splitters on 4 datasets: API docs, papers, contracts, support tickets. Metrics: retrieval recall@5, chunk coherence (intra-chunk cosine), overlap fidelity.

4. Results
Recursive splitter achieves 0.71 coherence vs 0.84 semantic. Mid-word cuts occurred in 12.3% of chunks >1000 chars.

5. Discussion
Overlap is not free: >30% overlap inflates index 1.4x without recall gain. Visual debugging catches drift before indexing.

6. Conclusion
A free, browser-native debugger saves ~45s per manual inspection.

References: Lewis et al. RAG, LangChain docs, HuggingFace Transformers.js
